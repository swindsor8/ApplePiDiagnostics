name: Codacy Security Scan

# Runs Codacy Analysis CLI and uploads per-tool SARIF files to GitHub Code
# Scanning (split so GitHub's single-run-per-category rule is always satisfied).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '41 3 * * 2'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Normalize SARIF runs for GitHub Code Scanning
        id: normalize
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          from pathlib import Path

          src = Path("results.sarif")
          out_dir = Path("codacy-sarif")
          out_dir.mkdir(exist_ok=True)

          if not src.is_file() or src.stat().st_size == 0:
              print("No results.sarif produced; skipping upload.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("count=0\n")
              raise SystemExit(0)

          data = json.loads(src.read_text(encoding="utf-8"))
          runs = data.get("runs", [])
          written = 0
          for idx, run in enumerate(runs):
              tool_name = (
                  run.get("tool", {})
                  .get("driver", {})
                  .get("name", f"tool-{idx}")
              )
              slug = re.sub(r"[^a-zA-Z0-9._-]+", "-", tool_name).strip("-").lower() or f"tool-{idx}"
              run["automationDetails"] = {"id": f"codacy/{slug}-{idx}/"}
              single = {
                  "$schema": data.get("$schema", "https://json.schemastore.org/sarif-2.1.0.json"),
                  "version": data.get("version", "2.1.0"),
                  "runs": [run],
              }
              (out_dir / f"{idx:02d}-{slug}.sarif").write_text(
                  json.dumps(single), encoding="utf-8"
              )
              written += 1

          print(f"Split results.sarif into {written} per-tool SARIF file(s).")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"count={written}\n")
          PYEOF

      - name: Upload SARIF results
        if: steps.normalize.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codacy-sarif
