name: ShellCheck

# Lints all shell scripts on every push to main and on pull requests.
# Catches quoting issues, missing error handling, and unsafe patterns —
# the same class of bugs addressed in the security hardening pass.

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.sh'
      - 'init'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.sh'
      - 'init'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on shell scripts
        run: |
          find . -name "*.sh" -not -path "./.git/*" \
            | xargs shellcheck --severity=warning

      - name: Run ShellCheck on init script
        run: shellcheck --severity=warning init
