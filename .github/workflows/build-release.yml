name: Build & Release Pi Image

# Triggered by pushing a version tag, e.g.: git tag v1.1.4 && git push --tags
# Builds both the flashable Pi OS image (apple-pi-diagnostics.img.xz) and the
# ARM64 failsafe initramfs (initramfs.cpio.gz) natively on ARM64, stamps
# os_list.json, and publishes all release assets atomically in a single release.
on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build flashable image & ARM64 initramfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write   # needed to create GitHub Releases and stamp os_list.json

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # 2. Install host-side build dependencies (native ARM64 — no QEMU needed)
      # -----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            kpartx \
            xz-utils \
            parted \
            e2fsprogs \
            rsync \
            wget \
            busybox-static \
            cpio \
            gzip

      # -----------------------------------------------------------------------
      # 3. Cache the base Pi OS image to avoid re-downloading on every run
      # -----------------------------------------------------------------------
      - name: Cache base Pi OS image
        uses: actions/cache@v5
        with:
          path: build/base-raspios-lite-arm64.img.xz
          key: base-raspios-lite-arm64-2025-05-13

      # -----------------------------------------------------------------------
      # 4. Build ARM64 failsafe initramfs
      # -----------------------------------------------------------------------
      - name: Build ARM64 failsafe initramfs
        run: |
          chmod +x build_failsafe.sh
          sudo ./build_failsafe.sh
          sudo chown -R "$(id -u):$(id -g)" build
          [[ -f build/initramfs.cpio.gz ]] \
            || { echo "ERROR: build/initramfs.cpio.gz not found"; exit 1; }
          [[ -f build/initramfs.cpio.gz.sha256 ]] \
            || { echo "ERROR: build/initramfs.cpio.gz.sha256 not found"; exit 1; }

      # -----------------------------------------------------------------------
      # 5. Build the flashable Pi image (native ARM64 chroot)
      # -----------------------------------------------------------------------
      - name: Build apple-pi-diagnostics image
        run: |
          chmod +x build-image.sh
          sudo ./build-image.sh
          sudo chown -R "$(id -u):$(id -g)" build apple-pi-diagnostics.img*

      # -----------------------------------------------------------------------
      # 6. Read output metadata
      # -----------------------------------------------------------------------
      - name: Read build metadata
        id: meta
        run: |
          XZ_FILE="apple-pi-diagnostics.img.xz"
          [[ -f "$XZ_FILE" ]]                      || { echo "ERROR: $XZ_FILE not found — build failed"; exit 1; }
          [[ -f "${XZ_FILE}.sha256" ]]             || { echo "ERROR: SHA256 file not found — build failed"; exit 1; }
          [[ -f "apple-pi-diagnostics.img" ]]      || { echo "ERROR: .img not found — build failed"; exit 1; }
          SHA256=$(awk '{print $1}' apple-pi-diagnostics.img.xz.sha256)
          XZ_SIZE=$(stat -c%s "${XZ_FILE}")
          RAW_SIZE=$(stat -c%s "apple-pi-diagnostics.img")
          TAG="${GITHUB_REF_NAME}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${XZ_FILE}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)

          echo "sha256=${SHA256}"         >> "$GITHUB_OUTPUT"
          echo "xz_size=${XZ_SIZE}"       >> "$GITHUB_OUTPUT"
          echo "raw_size=${RAW_SIZE}"     >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"
          echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 7. Stamp os_list.json with real values
      # -----------------------------------------------------------------------
      - name: Stamp os_list.json
        env:
          RELEASE_URL: ${{ steps.meta.outputs.release_url }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          XZ_SIZE: ${{ steps.meta.outputs.xz_size }}
          RAW_SIZE: ${{ steps.meta.outputs.raw_size }}
          RELEASE_DATE: ${{ steps.meta.outputs.release_date }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          with open("os_list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          entry = data["os_list"][0]
          entry["url"] = os.environ["RELEASE_URL"]
          entry["sha256sum"] = os.environ["SHA256"]
          entry["extract_size"] = int(os.environ["RAW_SIZE"])
          entry["image_download_size"] = int(os.environ["XZ_SIZE"])
          entry["release_date"] = os.environ["RELEASE_DATE"]

          with open("os_list.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PYEOF
          cp os_list.json "$RUNNER_TEMP/os_list.json"
          echo "--- stamped os_list.json ---"
          cat os_list.json

      # -----------------------------------------------------------------------
      # 8. Create or update GitHub Release and upload all assets atomically
      # -----------------------------------------------------------------------
      - name: Write release notes
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Apple Pi Diagnostics ${TAG}

          ### How to flash
          1. Open **Raspberry Pi Imager**
          2. Click **"Choose OS"** → scroll to the bottom → **"Use custom"**
          3. Select \`apple-pi-diagnostics.img.xz\` (or paste the download URL)
          4. Choose **No** when prompted for OS customisation settings
          5. Flash to SD card, insert into your Pi and power on

          ### Pi Imager custom URL
          To add this image to your own Pi Imager list, point it at:
          \`\`\`
          ${SERVER_URL}/${REPOSITORY}/releases/download/${TAG}/os_list.json
          \`\`\`

          ### Included assets
          - \`apple-pi-diagnostics.img.xz\` (+ \`.sha256\`) — flashable Raspberry Pi OS Bookworm 64-bit diagnostic image
          - \`initramfs.cpio.gz\` (+ \`.sha256\`) — standalone ARM64 failsafe initramfs
          - \`os_list.json\` — Raspberry Pi Imager manifest

          ### Supported hardware
          - Raspberry Pi 4 (all RAM variants)
          - Raspberry Pi 5
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Apple Pi Diagnostics ${TAG}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "${TAG}" \
              "apple-pi-diagnostics.img.xz" \
              "apple-pi-diagnostics.img.xz.sha256" \
              "os_list.json" \
              "build/initramfs.cpio.gz" \
              "build/initramfs.cpio.gz.sha256" \
              --clobber
          else
            gh release create "${TAG}" \
              --title "Apple Pi Diagnostics ${TAG}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "apple-pi-diagnostics.img.xz" \
              "apple-pi-diagnostics.img.xz.sha256" \
              "os_list.json" \
              "build/initramfs.cpio.gz" \
              "build/initramfs.cpio.gz.sha256"
          fi

      # -----------------------------------------------------------------------
      # 9. Commit stamped os_list.json back to main
      # -----------------------------------------------------------------------
      - name: Commit stamped os_list.json to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -f -B main origin/main

          cp "$RUNNER_TEMP/os_list.json" os_list.json
          git add os_list.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "chore: stamp os_list.json for ${TAG} [skip ci]"
          git push origin main
