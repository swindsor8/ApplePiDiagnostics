name: Pylint

# Run on pushes to main and on all pull requests targeting main.
# Previously ran on every push to every branch — that was wasteful and
# caused false import-error failures because dependencies weren't installed.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: full-linux-gui/requirements.txt

      # Install system packages required by PyQt5 so pylint can resolve imports
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-pyqt5 \
            libglib2.0-0

      # Install the project's Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r full-linux-gui/requirements.txt

      - name: Run Pylint
        run: |
          pylint \
            --disable=C,R \
            --disable=W0611 \
            $(git ls-files 'full-linux-gui/app/*.py' 'full-linux-gui/app/**/*.py')
