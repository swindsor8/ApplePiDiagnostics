name: Pylint

# Run on pushes to main and on all pull requests targeting main.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false   # don't cancel sibling matrix jobs when one fails
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: full-linux-gui/requirements.txt

      # Install system libraries that PyQt5 needs at runtime.
      # Note: python3-pyqt5 installs the system Python binding; we still pip-install
      # PyQt5 for the virtualenv, but the shared libs it needs come from here.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libqt5widgets5 \
            libqt5gui5 \
            libqt5core5a \
            libglib2.0-0

      # Install the project's Python dependencies into the virtualenv
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r full-linux-gui/requirements.txt

      - name: Run Pylint
        run: |
          FILES=$(git ls-files 'full-linux-gui/app/*.py' 'full-linux-gui/app/**/*.py')
          if [ -z "$FILES" ]; then
            echo "No Python files found to lint"
            exit 1
          fi
          echo "Linting files:"
          echo "$FILES"
          pylint \
            --exit-zero \
            --disable=C,R \
            --disable=W0611,W0718,W0201,W1514,W1510,W0621,W0613,W0404,W1309,W0641 \
            --disable=E0401 \
            $FILES
