name: Release — Failsafe Initramfs

# Manual workflow to rebuild and attach the standalone versioned ARM64 failsafe
# initramfs (apple-pi-diagnostics-initramfs-<tag>.cpio.gz) to an existing tag.
#
# Regular tag pushes (v*.*.*) build and upload both the Pi image and the ARM64
# failsafe initramfs atomically in build-release.yml so there is no race
# condition with validate-release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the initramfs to (e.g. v1.1.5)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-initramfs:
    name: Build ARM64 initramfs and upload artifact
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write   # needed to upload release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends busybox-static cpio gzip

      - name: Build versioned failsafe initramfs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          INITRAMFS_FILE="apple-pi-diagnostics-initramfs-${TAG}.cpio.gz"
          chmod +x build_failsafe.sh
          sudo ./build_failsafe.sh
          sudo chown -R "$(id -u):$(id -g)" build
          [[ -f build/initramfs.cpio.gz ]] \
            || { echo "ERROR: build/initramfs.cpio.gz not found — build failed"; exit 1; }
          cp build/initramfs.cpio.gz "build/${INITRAMFS_FILE}"
          (cd build && sha256sum "${INITRAMFS_FILE}" > "${INITRAMFS_FILE}.sha256")
          (cd build && sha256sum -c "${INITRAMFS_FILE}.sha256")

      - name: Upload initramfs artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          INITRAMFS_FILE="apple-pi-diagnostics-initramfs-${TAG}.cpio.gz"
          gh release view "${TAG}" >/dev/null 2>&1 \
            || gh release create "${TAG}" --title "Apple Pi Diagnostics ${TAG}" --notes ""
          gh release upload "${TAG}" \
            "build/${INITRAMFS_FILE}" \
            "build/${INITRAMFS_FILE}.sha256" \
            --clobber
