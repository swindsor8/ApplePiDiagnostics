name: Validate Release

# Triggered automatically when a GitHub Release is published.
# Downloads the versioned release assets, verifies their SHA256 checksums, and
# validates that os_list.json was stamped with the exact release tag and URL.
on:
  release:
    types: [ published ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "${TAG}" \
            --pattern "apple-pi-diagnostics-${TAG}.img.xz" \
            --pattern "apple-pi-diagnostics-${TAG}.img.xz.sha256" \
            --pattern "apple-pi-diagnostics-initramfs-${TAG}.cpio.gz" \
            --pattern "apple-pi-diagnostics-initramfs-${TAG}.cpio.gz.sha256" \
            --pattern "os_list.json"

      - name: Verify SHA256 checksums
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for asset in "apple-pi-diagnostics-${TAG}.img.xz" "apple-pi-diagnostics-initramfs-${TAG}.cpio.gz"; do
            EXPECTED=$(awk '{print $1}' "${asset}.sha256")
            ACTUAL=$(sha256sum "${asset}" | awk '{print $1}')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::SHA256 MISMATCH on ${asset}"
              echo "  Expected: $EXPECTED"
              echo "  Actual:   $ACTUAL"
              exit 1
            fi
            echo "SHA256 verified OK (${asset}): $ACTUAL"
          done

      - name: Validate os_list.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'EOF'
          import json, os

          with open("os_list.json", encoding="utf-8") as f:
              data = json.load(f)

          assert "os_list" in data, "Missing top-level 'os_list' key"
          assert len(data["os_list"]) > 0, "'os_list' array is empty"

          entry = data["os_list"][0]
          required_fields = ["name", "url", "extract_size", "image_download_size", "release_date", "sha256sum"]
          for field in required_fields:
              assert field in entry, f"Missing required field: '{field}'"

          tag = os.environ["TAG"]
          expected_filename = f"apple-pi-diagnostics-{tag}.img.xz"
          assert tag in entry["name"], \
              f"name '{entry['name']}' does not contain tag '{tag}'"
          assert f"/releases/download/{tag}/{expected_filename}" in entry["url"], \
              f"url '{entry['url']}' does not point to '{expected_filename}' for tag '{tag}'"
          assert entry["sha256sum"] != "SHA256_PLACEHOLDER", \
              "sha256sum field still contains placeholder — stamping failed"
          assert entry["extract_size"] > 0, \
              "extract_size is 0 — stamping failed"
          assert entry["image_download_size"] > 0, \
              "image_download_size is 0 — stamping failed"
          assert entry["release_date"] != "RELEASE_DATE_PLACEHOLDER", \
              "release_date field still contains placeholder — stamping failed"

          print("os_list.json validation passed")
          print(f"  Name:          {entry['name']}")
          print(f"  URL:           {entry['url']}")
          print(f"  Release date:  {entry['release_date']}")
          print(f"  Download size: {entry['image_download_size']:,} bytes")
          print(f"  Extract size:  {entry['extract_size']:,} bytes")
          EOF
