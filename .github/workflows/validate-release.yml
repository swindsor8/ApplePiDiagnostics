name: Validate Release

# Triggered automatically when a GitHub Release is published.
# Downloads the release assets, verifies the SHA256 checksum matches the
# published .sha256 file, and validates that os_list.json was correctly stamped
# (no placeholder values remain, required fields are present).
# Catches corrupted uploads or stamping bugs before users download the image.

on:
  release:
    types: [ published ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "${TAG}" \
            --pattern "apple-pi-diagnostics.img.xz" \
            --pattern "apple-pi-diagnostics.img.xz.sha256" \
            --pattern "initramfs.cpio.gz" \
            --pattern "initramfs.cpio.gz.sha256" \
            --pattern "os_list.json"

      - name: Verify SHA256 checksums
        run: |
          for asset in apple-pi-diagnostics.img.xz initramfs.cpio.gz; do
            EXPECTED=$(awk '{print $1}' "${asset}.sha256")
            ACTUAL=$(sha256sum "${asset}" | awk '{print $1}')
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::SHA256 MISMATCH on ${asset}"
              echo "  Expected: $EXPECTED"
              echo "  Actual:   $ACTUAL"
              exit 1
            fi
            echo "SHA256 verified OK (${asset}): $ACTUAL"
          done

      - name: Validate os_list.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'EOF'
          import json, os

          with open("os_list.json", encoding="utf-8") as f:
              data = json.load(f)

          assert "os_list" in data, "Missing top-level 'os_list' key"
          assert len(data["os_list"]) > 0, "'os_list' array is empty"

          entry = data["os_list"][0]
          required_fields = ["url", "extract_size", "image_download_size", "release_date", "sha256sum"]
          for field in required_fields:
              assert field in entry, f"Missing required field: '{field}'"

          # Verify placeholder values were replaced and URL matches this release tag
          tag = os.environ["TAG"]
          assert entry["url"] != "RELEASE_URL_PLACEHOLDER", \
              "url field still contains placeholder — stamping failed"
          assert f"/releases/download/{tag}/" in entry["url"], \
              f"url '{entry['url']}' does not point to tag '{tag}'"
          assert entry["sha256sum"] != "SHA256_PLACEHOLDER", \
              "sha256sum field still contains placeholder — stamping failed"
          assert entry["extract_size"] > 0, \
              "extract_size is 0 — stamping failed"
          assert entry["image_download_size"] > 0, \
              "image_download_size is 0 — stamping failed"
          assert entry["release_date"] != "RELEASE_DATE_PLACEHOLDER", \
              "release_date field still contains placeholder — stamping failed"

          print("os_list.json validation passed")
          print(f"  URL:           {entry['url']}")
          print(f"  Release date:  {entry['release_date']}")
          print(f"  Download size: {entry['image_download_size']:,} bytes")
          print(f"  Extract size:  {entry['extract_size']:,} bytes")
          EOF
